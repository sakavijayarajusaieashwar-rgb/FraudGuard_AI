services:
  - type: web
    name: fraudguard-ai
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    disk:
      name: fraudguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: ENABLE_DEMO_RESET
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/fraudguard.db
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
